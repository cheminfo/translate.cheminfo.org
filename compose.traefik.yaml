# Traefik deployment — no port published on the host.
#
# Requires an external Docker network named `traefik` that hosts the Traefik
# reverse proxy, with a `websecure` entrypoint and a `letsencrypt` cert resolver.
#
# Select via COMPOSE_FILE=compose.traefik.yaml in .env, then: docker compose up -d

services:
  translate:
    # Use the released image by default. To build locally instead, run:
    #   docker compose up -d --build
    image: ${IMAGE_NAME:-ghcr.io/cheminfo/translate.cheminfo.org}:${IMAGE_TAG:-latest}
    build: .
    # What the server's deploy script probes before it keeps a new container.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:10914/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - path: .env
        required: false
    mem_limit: 512m
    cpus: 1
    pids_limit: 256
    ulimits:
      core: 0
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
    networks:
      - default
      - traefik
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.translate.rule=Host(`translate.cheminfo.org`)'
      - 'traefik.http.routers.translate.entrypoints=websecure'
      - 'traefik.http.routers.translate.tls.certresolver=letsencrypt'
      - 'traefik.http.services.translate.loadbalancer.server.port=${PORT:-10914}'

networks:
  traefik:
    external: true
